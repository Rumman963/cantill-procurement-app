<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corvo PR-to-PO</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">C</span> Corvo <b>PR&rarr;PO</b></div>
    <nav id="nav">
      <a href="#/chat" data-route="chat">Raise request</a>
      <a href="#/workspace" data-route="workspace">Buyer workspace</a>
      <a href="#/batch" data-route="batch">Batch &amp; API</a>

    <div class="who">

  <main id="view"></main>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>

</html>
