<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corvo PR-to-PO</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232563eb%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27Arial%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">C</span> Corvo <b>PR&rarr;PO</b></div>
    <nav id="nav">
      <a href="#/chat" data-route="chat">Raise request</a>
      <a href="#/workspace" data-route="workspace">Buyer workspace</a>
      <a href="#/batch" data-route="batch">Batch &amp; API</a>
      <a href="#/policy" data-route="policy">Policy</a>
      <a href="#/contracts" data-route="contracts">Contracts</a>
      <a href="#/suppliers" data-route="suppliers">Preferred suppliers</a>
      <a href="#/data" data-route="data">Data</a>
      <a href="#/audit" data-route="audit">Audit log</a>
    </nav>
    <div class="who">
      <span id="policyBadge" class="pill"></span>
      <label for="userName">Acting as</label><input id="userName" title="Your name (recorded on every action)" placeholder="Your name">
    </div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
